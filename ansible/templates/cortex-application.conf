# Cortex application config
# Full reference: https://docs.strangebee.com/cortex/installation-and-configuration/

play.http.secret.key = "{{ cortex_secret }}"

analyzer {
  urls = [
    "https://download.thehive-project.org/analyzers.json"
  ]
}

# Analyzer API keys - enable in Cortex UI under Organization -> Analyzers,
# then set the corresponding key here or via UI config directly.
# VirusTotal_GetReport: {{ cortex_virustotal_key }}
# AbuseIPDB: {{ cortex_abuseipdb_key }}
